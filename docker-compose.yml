version: "3.9"

services:
  api:
    build: .
    ports:
      - "8000:8000"
    environment:
      - APP_ENV=production
      - DATABASE_URL=sqlite:///./ai_digital_safety.db
      - STORE_ANALYSIS=false
      - CORS_ALLOWED_ORIGINS=http://localhost:5173
      - THREAT_INTEL_ENABLED=true
      - URLHAUS_ENABLED=false
      - PHISHTANK_ENABLED=false
      - GOOGLE_SAFE_BROWSING_API_KEY=
    volumes:
      - ./models:/app/models
      - ./data:/app/data
      - ./reports:/app/reports
      - ./logs:/app/logs
    restart: unless-stopped

  # Future (Phase 2): uncomment once frontend/ has a real React app.
